<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגרלת רכב</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Heebo',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:linear-gradient(135deg,#0f2a44,#163a5c);color:#fff;text-align:center;padding:24px}
  .box{max-width:460px}
  .ic{width:90px;height:90px;border-radius:24px;background:rgba(15,163,163,.25);display:flex;align-items:center;justify-content:center;font-size:42px;margin:0 auto 22px;color:#5fe0e0}
  h1{font-size:34px;font-weight:800;margin-bottom:10px}
  p{opacity:.8;font-size:18px;line-height:1.6}
  .ref{margin-top:22px;display:none;background:rgba(255,255,255,.1);border-radius:12px;padding:12px 18px;font-size:15px}
</style>
</head>
<body>
  <div class="box">
    <div class="ic"><i class="fa-solid fa-car-side"></i></div>
    <h1>הגרלת רכב</h1>
    <p>דף ההגרלה יעלה בקרוב.</p>
    <div class="ref" id="ref"></div>
  </div>
<script>
// דף זמני: רושם כניסה דרך קישור אישי ושומר את קוד השגריר לרכישה בהמשך
(async () => {
  const ref = new URLSearchParams(location.search).get('ref');
  if (!ref) return;
  try { localStorage.setItem('raffle_ref', ref); } catch (e) {}
  try {
    fetch('/api/public/visit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ ref }) });
    const r = await (await fetch('/api/public/ref/' + encodeURIComponent(ref))).json();
    if (r.valid) { const el = document.getElementById('ref'); el.textContent = 'הגעת דרך ' + r.first_name; el.style.display = 'block'; }
  } catch (e) {}
})();
</script>
</body>
</html>
